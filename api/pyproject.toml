[project]
name = "swipe-api"
version = "0.1.0"
description = "Swipe — writing-integrity platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0",
  "python-jose[cryptography]>=3.3",
  "celery>=5.3",
  "redis>=5.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# AI detection — heavy; install when running Phase 1 detection/evaluation.
# Needs a GPU or ~16 GB RAM for the Falcon-7B model pair.
ml = ["torch>=2.5", "transformers>=4.44", "datasets>=2.19", "scikit-learn>=1.4", "accelerate>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
